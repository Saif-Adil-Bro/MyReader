name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Stable Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Keystore on the fly (ম্যাজিক চাবি)
      run: |
        mkdir -p app
        keytool -genkeypair -v -keystore app/myreader-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias myreader -dname "CN=MyReader, OU=App, O=Premium, C=BD" -storepass "myreader123" -keypass "myreader123"

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: MyReader-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
