name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Stable Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Release APK with Permanent Keystore
      run: gradle assembleRelease -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/my-google-key.jks -Pandroid.injected.signing.store.password=myreader123 -Pandroid.injected.signing.key.alias=myreader -Pandroid.injected.signing.key.password=myreader123

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: MyReader-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
